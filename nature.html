
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature - CuriousMind</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #effaf0;
            color: #20452b;
            text-align: center;
        }

        header {
            background: #14532d;
            color: white;
            padding: 25px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 35px 20px;
        }

        .card {
            background: white;
            padding: 25px;
            width: 250px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        .card p {
            color: #526657;
            line-height: 1.6;
        }

        button {
            background: #16803d;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #11632f;
        }

        a {
            display: inline-block;
            margin: 20px;
            color: #16803d;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>🌱 Explore Nature</h1>
        <p>Discover the wonders of our natural world!</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>🌿 Plants</h2>
            <p>Learn how plants grow and make their own food.</p>
            <button onclick="location.href='plants.html'">
                Explore Plants
            </button>
        </div>

        <div class="card">
            <h2>🐾 Animals</h2>
            <p>Discover animal behaviour, habitats and adaptations.</p>
            <button onclick="location.href='animals.html'">
                Explore Animals
            </button>
        </div>

        <div class="card">
            <h2>🌍 Environment</h2>
            <p>Understand ecosystems, pollution and climate.</p>
            <button onclick="location.href='environment.html'">
                Explore Environment
            </button>
        </div>

    </div>

    <a href="topics.html">← Back to Topics</a>

</body>
</html>
