
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science - CuriousMind</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef6ff;
            color: #183153;
            text-align: center;
        }

        header {
            background: #102a43;
            color: white;
            padding: 25px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;

            padding: 35px 20px;
        }

            background: white;
            padding: 25px;
            width: 250px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        .card p {
            color: #475569;
            line-height: 1.6;
        }

        button {
            background: #0879d9;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #075aa3;
        }

        a {
            display: inline-block;
            margin: 20px;
            color: #0879d9;
            text-decoration: none;
        }

</head>

<body>

    <header>

    <div class="container">

            <button onclick="location.href='space.html'">

            </button>
        </div>

        <div class="card">
            <h2>🫀 Human Body</h2>
            <p>Learn how your heart, brain and lungs work.</p>
