
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore Topics - CuriousMind</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef6ff;
            color: #183153;
            text-align: center;
        }

        header {
            background: #102a43;
            color: white;
            padding: 25px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 45px 20px;
        }

        .card {
            background: white;
            width: 250px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #00000015;
        }

        .card h2 {
            font-size: 25px;
        }

        .card p {
            line-height: 1.6;
            color: #475569;
        }

        button {
            background: #0879d9;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #075aa3;
        }

        .back {
            display: inline-block;
            margin: 10px 0 35px;
            color: #0879d9;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Explore and Learn 🔬</h1>
        <p>Choose your favourite subject!</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>🔬 Science</h2>
            <p>Discover space, chemistry, the human body and more.</p>
            <button onclick="location.href='science.html'">
                Explore Science →
            </button>
        </div>

        <div class="card">
            <h2>🌱 Nature</h2>
            <p>Learn about plants, animals and our environment.</p>
            <button onclick="location.href='nature.html'">
                Explore Nature →
            </button>
        </div>

        <div class="card">
            <h2>⚡ Physics</h2>
            <p>Understand light, electricity, forces and energy.</p>
            <button onclick="location.href='physics.html'">
                Explore Physics →
            </button>
        </div>

    </div>

    <a class="back" href="index.html">← Back to Home</a>

</body>
</html>
